name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: SuperSlayQueen
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#c084fc&color_dots=#161b22,#3b0764,#6b21a8,#9333ea,#c026d3
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#d8b4fe&color_dots=#161b22,#4c1d95,#7e22ce,#a21caf,#d946ef

      - name: Push generated files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
