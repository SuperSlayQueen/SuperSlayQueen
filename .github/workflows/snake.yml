name: Generate Contribution Snake

on:

jobs:
generate:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Generate Snake
    uses: Platane/snk@v3
    with:
      github_user_name: SuperSlayQueen
      outputs: |
        dist/github-contribution-grid-snake.svg
        dist/github-contribution-grid-snake-dark.svg?palette=github-dark

  - name: Publish Snake
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git fetch origin output:output || true

      if git show-ref --verify --quiet refs/heads/output; then
        git checkout output
      else
        git checkout --orphan output
        git rm -rf . || true
      fi

      cp dist/github-contribution-grid-snake.svg .
      cp dist/github-contribution-grid-snake-dark.svg .

      git add github-contribution-grid-snake.svg
      git add github-contribution-grid-snake-dark.svg

      git commit -m "Update contribution snake" || true
      git push origin output
```
