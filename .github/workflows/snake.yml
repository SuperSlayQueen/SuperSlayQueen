name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: SuperSlayQueen
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#c084fc&color_dots=#161b22,#3b0764,#6b21a8,#9333ea,#c026d3
            dist/github-contribution-grid-snake-dark.svg?color_snake=#d8b4fe&color_dots=#161b22,#4c1d95,#7e22ce,#a21caf,#d946ef

      - name: Publish to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin output || true

          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git checkout -B output origin/output
          else
            git checkout --orphan output
            git rm -rf . || true
          fi

          cp -r dist/* .
          git add .

          git diff --cached --quiet || git commit -m "Update contribution snake"
          git push origin output --force
