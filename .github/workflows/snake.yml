name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: SuperSlayQueen
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#c084fc&color_dots=#161b22,#3b0764,#6b21a8,#9333ea,#c026d3
            dist/github-contribution-grid-snake-dark.svg?color_snake=#d8b4fe&color_dots=#161b22,#4c1d95,#7e22ce,#a21caf,#d946ef

      - name: Publish snake
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update contribution snake"
          add: "dist"
          new_branch: output
